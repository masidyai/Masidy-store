<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline - Masidy</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background-color: #fafaf8;
        color: #1a1a1a;
      }

      .container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
      }

      .content {
        max-width: 400px;
        background: white;
        border: 1px solid #e5e5e0;
        border-radius: 8px;
        padding: 2rem;
        text-align: center;
      }

      .icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        background-color: #f5f5f2;
        border-radius: 50%;
        margin-bottom: 1.5rem;
      }

      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }

      p {
        font-size: 0.875rem;
        color: #999;
        margin-bottom: 1.5rem;
      }

      button {
        background-color: #1a1a1a;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 4px;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      button:hover {
        background-color: #333;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="content">
        <div class="icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8.111 16H5m13 0h2.888M5 12h2m12 0h2M5 8h2m12 0h2"></path>
          </svg>
        </div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. Some features are limited, but you can still browse cached pages.</p>
        <button onclick="window.location.reload()">Try Again</button>
      </div>
    </div>
  </body>
</html>
